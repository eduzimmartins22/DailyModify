name: daily-commit

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 12:00 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente para testar

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registrar atividade do dia
        run: |
          echo "Enganado Recrutador Atualizado em $(date -u +'%Y-%m-%d %H:%M UTC')" >> activity.log
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add activity.log
          git commit -m "chore: daily update $(date -u +%F)"
          git push
